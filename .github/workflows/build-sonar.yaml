name: Build, Test, and Sonar Analysis

on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
    branches:
      - master
  workflow_dispatch:
    inputs:
      quality-gate:
        description: >
          Quality Gate
        type: boolean
        default: true


jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get dependencies
        run: go mod vendor

      - name: Build application
        run: go build -o ./app ./cmd/project

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out ./...
        
      - name: Setup mise
        run: |
          curl https://mise.run | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.local/share/mise/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.local/share/mise/shims" >> "${GITHUB_PATH}"

      - name: Install SonarScanner CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise use --global sonar-scanner-cli@8 
          mise use --global github-cli@2

      - name: Search for issues
        id: search-for-issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          query="is:pr+is:open+repo:${{ github.repository }}+head:${{ github.ref_name }}"
          
          result=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/search/issues?q=$query" | jq -c '.items | map(.number)'
          )
          echo "result=$result" >> $GITHUB_OUTPUT          

      - name: Run SonarScanner CLI analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_CLOUD_TOKEN }}
          PULL_REQUEST_KEY: ${{ fromJSON(steps.search-for-issues.outputs.result)[0] }}
        run: |
          sonar-scanner \
            ${PULL_REQUEST_KEY:+-Dsonar.pullrequest.key=$PULL_REQUEST_KEY} \
            -Dsonar.qualitygate.wait=${{ inputs.quality-gate && 'true' || 'false' }}

